# DHU Backup — daemon configuration. Root-owned, 0644.
#
# Every value here is read by a ROOT process, so this file must never be
# writable by the agent lanes. The installer places it with `install -o root
# -g wheel -m 0644` and prints its sha256.

root       = /Library/DHU/backup
watchlist  = /Library/DHU/backup/etc/watchlist.conf

# The uid whose files are mirrored. A file owned by anyone else is refused —
# which is what stops a hard link to a root-owned file becoming a disclosure
# oracle (review C6). Rewritten by install.sh from $SUDO_UID.
owner_uid  = 501

# 15 s is the accepted floor. A file created AND deleted
# inside one interval is missed; the incident's lost work lived an hour.
interval_seconds       = 15
prune_interval_seconds = 3600
retention_days         = 30

# Budgets. The volume sat at 97 % full when this was designed, so these are not
# theoretical. On store_ceiling or free_space_floor the daemon goes DEGRADED and
# never self-heals; the other three are per-entry skips.
max_file_bytes         = 1048576
max_store_bytes        = 5368709120
max_versions_per_path  = 200
max_new_files_per_scan = 2000
min_free_bytes         = 10737418240
max_watch_roots        = 64
